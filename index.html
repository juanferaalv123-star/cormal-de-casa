<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Mi Página Web</title>
  </head>

  <body>

    <main class="bg-champagne-mist-50"> 


      <section class="bg-black-forest-800">

        <section class="max-w-6xl mx-auto p-4 bg-black-forest-800 pb-10" >

          <h1 class="font-display text-3xl font-bold text-center text-white">Disfurta México donde estés</h1>

          <div class="grid  mt-4 bg-black-forest-800">

            <img src="./Img/donde_estes.jpg" alt="Imagen de mesa con comida mexicana" class="w-full  rounded-t-2xl">

            <div class="grid gap-1 sm:grid-cols-2 ">

              <div class="p-15 bg-champagne-mist-50 text-center">
                <img src="./Img/domicilios.jpg" alt="Icono de entrega a domicilio" class="mx-auto mb-4 rounded-2xl h-40 ">
                <h2 class="font-display text-2xl font-bold text-rich-mahogany-800">Domicilios</h2>
                <p class="font-body text-black-forest-800">Realiza tu pedido</p>
                <button class="bg-bright-lemon-400 font-display py-2 px-4 mt-4 rounded-2xl text-xl hover:bg-rich-mahogany-700">Pedir a domicilio</button>
              </div>

              <div class="p-15 bg-champagne-mist-50 text-center">
                <img src="./Img/reservas.jpg" alt="Icono de reservas" class="mx-auto mb-4 rounded-2xl h-40 ">
                <h2 class="font-display text-2xl font-bold text-rich-mahogany-800">Reservas</h2>
                <p class="font-body text-black-forest-800">Reserva tu mesa</p>
                <button class="bg-bright-lemon-400 font-display py-2 px-4 mt-4 rounded-2xl text-xl hover:bg-rich-mahogany-700">Hacer reserva</button>
              </div>

            </div>
          
          </div>
        </section>

      </section>


        <img src="./Img/patron_verde.jpg" alt="" class="object-cover object-right w-full h-5  ">


    <section class=" max-w-6xl mx-auto justify-content text-center items-center pb-25 bg-champagne-mist-50" >
      <h2 class="font-display text-2xl font-bold mt-15 p-6">Servicios</h2>

        <div class="font-body grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 text-center mt-6 justify-center bg-rich-mahogany-800 gap-1" >
          <div class="p-6 bg-champagne-mist-50">
            <img src="./Img/pago.png" alt="Icono de entrega a domicilio" class="mx-auto mb-4 rounded-2xl h-60 w-65 ">
            <h3 class="font-display text-2xl font-bold text-center">Multiples medios de pago</h3>  
            <p class="font-body text-black-forest-800">Paga como te quede mejor</p>        
          </div>
          <div class="p-6 bg-champagne-mist-50">
            <img src="./Img/menu.png" alt="Icono de menú adaptado" class="mx-auto mb-4 rounded-2xl h-60 w-65">
            <h3 class="font-display text-2xl font-bold text-center">Menú adaptado</h3>
            <p class="font-body text-black-forest-800">Pregúntanos por alergias y dietas</p>
          </div>
          <div class="p-6 bg-champagne-mist-50">
            <img src="./Img//exclusividad.png" alt="Icono de exclusividad" class="mx-auto mb-4 rounded-2xl h-60 w-65">
            <h3 class="font-display text-2xl font-bold text-center">Exclusividad</h3>
            <p class="font-body text-black-forest-800">Eventos y cenas privadas</p>
          </div>
          <div class="p-6 bg-champagne-mist-50">
            <img src="./Img/estacionamiento.png" alt="Icono de estacionamiento" class="mx-auto mb-4 rounded-2xl h-60 w-65 ">
            <h3 class="font-display text-2xl font-bold text-center">Estacionamiento</h3>
            <p class="font-body text-black-forest-800">Llega sin afán</p>
          </div>
        </div>

    </section>

    </main>
    
  </body>
</html>
