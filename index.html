<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/output.css">
    <title>Mi Página Web</title>
  </head>

  <body class="bg-champagne-mist-100 font-body text-black">

    <aside class="bg-rich-mahogany-800 text-champagne-mist-100">
      <div class="mx-auto flex max-w-5xl flex-col gap-6 p-6 md:flex-row md:items-center md:justify-between">

        <article class="md:max-w-xl">
          <h2 class="font-display text-3xl font-bold">
            Conviértete en parte de nuestra familia y disfruta varios beneficios
          </h2>
          
        </article>

        <article>
          <a href="#"
             class="inline-block rounded-lg bg-bright-lemon-300 px-6 py-3 font-semibold text-black transition duration-300 hover:bg-bright-lemon-400">
            Únete ahora
          </a>
        </article>

      </div>
    </aside>

    <main class="mx-auto max-w-6xl px-4 pb-16">

      <!-- ============ 2. CATEGORÍAS (tarjetas que giran) ============ -->
      <section class="mt-10 text-center">
        <h2 class="font-display text-5xl font-bold">Descubre nuestros sabores</h2>
        <p class="mx-auto mt-3 max-w-2xl sm:text-lg">
          Explora nuestras diferentes categorías preparadas con ingredientes frescos y recetas ancestrales.
        </p>

        <!-- Aquí JavaScript dibuja las tarjetas -->
        <div id="categorias" class="mt-8 grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
      </section>

    </main>
    <script>
      // =====================================================
      // 1) LOS DATOS: una categoría por cada { }.
      //    "enlace" es la página a la que lleva la tarjeta.
      //    Por ahora todas tienen "#" (no llevan a ningún lado).
      //    >>> PENDIENTE: cuando crees cada página, cambia el "#"
      //        por su nombre, por ejemplo "entradas.html".
      // =====================================================
      const categorias = [
        {
          nombre: "Entradas",
          imagen: "Img/prueda.png",
          descripcion: "Bocados ligeros para abrir el apetito, preparados con ingredientes frescos y sabor casero.",
          enlace: "#" // PENDIENTE: página de Entradas
        },
        {
          nombre: "Platos principales",
          imagen: "Img/prueda.png",
          descripcion: "Recetas ancestrales servidas en porciones generosas, ideales para compartir en familia.",
          enlace: "#" // PENDIENTE: página de Platos principales
        },
        {
          nombre: "Postres",
          imagen: "Img/prueda.png",
          descripcion: "Dulces caseros para cerrar la comida con un final suave y delicioso.",
          enlace: "#" // PENDIENTE: página de Postres
        },
        {
          nombre: "Bebidas",
          imagen: "Img/prueda.png",
          descripcion: "Jugos naturales, café y refrescos para acompañar cada plato de tu mesa.",
          enlace: "#" // PENDIENTE: página de Bebidas
        },
        {
          nombre: "Cócteles y licores",
          imagen: "Img/prueda.png",
          descripcion: "Mezclas de la casa y licores selectos para brindar en buena compañía.",
          enlace: "#" // PENDIENTE: página de Cócteles y licores
        },
        {
          nombre: "Especialidades",
          imagen: "Img/prueda.png",
          descripcion: "Los platos insignia de la casa, recomendados por nuestros cocineros.",
          enlace: "#" // PENDIENTE: página de Especialidades
        }
      ];

      // 2) DÓNDE SE DIBUJA: buscamos el contenedor vacío del HTML por su id.
      const contenedorTarjetas = document.getElementById("categorias");

      // 3) DIBUJAR: por cada categoría creamos una tarjeta.
      //    Toda la tarjeta es un enlace (<a>) hacia su propia página.
      categorias.forEach(function (categoria) {
        contenedorTarjetas.innerHTML += `
          <a href="${categoria.enlace}" class="tarjeta group block h-64 perspective-distant">

            <!-- "interior" es la pieza que gira -->
            <div class="interior relative h-full w-full transform-3d transition-transform duration-700 group-hover:rotate-y-180 group-focus-visible:rotate-y-180">

              <!-- Cara de adelante: imagen + nombre -->
              <div class="absolute inset-0 overflow-hidden rounded-lg shadow-md backface-hidden">
                <img src="${categoria.imagen}" alt="${categoria.nombre}" class="h-full w-full object-cover">
                <p class="absolute bottom-3 right-3 rounded-lg bg-black-forest-800 px-3 py-2 text-champagne-mist-100">
                  ${categoria.nombre}
                </p>
              </div>

              <!-- Cara de atrás: explicación + "Ver más" -->
              <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 rounded-lg bg-black-forest-800 p-6 text-center text-champagne-mist-100 shadow-md backface-hidden rotate-y-180">
                <p class="text-lg">${categoria.descripcion}</p>
                <span class="rounded-lg bg-bright-lemon-300 px-4 py-2 font-semibold text-black">Ver más</span>
              </div>

            </div>
          </a>
        `;
      });

      // 4) CELULAR: en pantallas táctiles no existe "hover".
      //    Primer toque = gira la tarjeta. Segundo toque = entra a la página.
      const tarjetas = document.querySelectorAll(".tarjeta");

      tarjetas.forEach(function (tarjeta) {
        tarjeta.addEventListener("click", function (evento) {
          const esTactil = window.matchMedia("(hover: none)").matches;
          const interior = tarjeta.querySelector(".interior");
          const yaGirada = interior.classList.contains("rotate-y-180");

          if (esTactil && !yaGirada) {
            evento.preventDefault();                // no sigas el enlace todavía
            interior.classList.add("rotate-y-180"); // solo gira la tarjeta
          }
        });
      });

      // =====================================================
      // 5) ESPACIO PARA CÓDIGO FUTURO
      //    Escribe aquí lo nuevo que quieras agregar
      //    (por ejemplo: menú móvil, filtros, animaciones...).
      //    Así queda separado de lo anterior y es fácil de encontrar.
      // =====================================================


    </script>
    
    
  </body>
</html>
